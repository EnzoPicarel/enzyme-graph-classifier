[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzyme-graph-classifier"
version = "0.1.0"
description = "Reproducible PyTorch benchmark for ENZYMES graph classification"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
enzyme-graph = "enzyme_graph.cli:main"

[project.optional-dependencies]
geometry = ["scipy>=1.10", "scikit-learn>=1.6,<1.11", "threadpoolctl>=3.5"]

[tool.setuptools]
packages = ["enzyme_graph"]
